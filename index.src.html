<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1f">
<title>تولدت مبارک غزل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff9ec7;--lilac:#b79cff;--navy:#0d0b1f;--gold:#ffd98a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07061a;overflow:hidden}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
textarea,input{font-family:inherit;user-select:text;-webkit-user-select:text}
.stage{--u:min(1vw,.5625dvh);position:relative;height:100dvh;width:min(100vw,calc(100dvh*9/16));margin:0 auto;overflow:hidden;overflow:clip;background:var(--navy);font-size:calc(var(--u)*4)}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s ease;overflow:hidden;overflow:clip}
.scene.active{opacity:1;pointer-events:auto}
.scene:not(.active) *{animation-play-state:paused!important}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.scenery{position:absolute;inset:0;z-index:1;pointer-events:none}
.scenery>svg{position:absolute;inset:0;width:100%;height:100%}
.has-bg .scenery{display:none}
.abs{position:absolute}
.stars{position:absolute;inset:0;pointer-events:none;z-index:1}
.stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fx span{position:absolute;bottom:-8%;opacity:0;animation:rise linear infinite;will-change:transform}
.fx.fall span{bottom:auto;top:-8%;animation-name:fall}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.85}100%{transform:translate(var(--dx,0),-112dvh) rotate(var(--rot,20deg));opacity:0}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.95}92%{opacity:.9}100%{transform:translate(var(--dx,0),112dvh) rotate(var(--rot,200deg));opacity:0}}
.fx .dot{width:4px;height:4px;border-radius:50%;background:#ffd98a;box-shadow:0 0 8px 2px rgba(255,217,138,.7)}
.cloud{fill:rgba(255,255,255,.15);animation:drift 36s ease-in-out infinite alternate}
.cloud.c2{animation-duration:48s;animation-direction:alternate-reverse}.cloud.c3{animation-duration:42s}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(50px)}}
.bunting{position:absolute;left:0;top:0;width:100%;height:12%;z-index:3;pointer-events:none;transform-origin:top center;animation:sway2 6s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:skewX(-1.2deg)}50%{transform:skewX(1.2deg)}}
.lights{position:absolute;left:0;right:0;top:0;width:100%;height:9%;pointer-events:none;z-index:3}
.lights circle{animation:bulb 2.4s ease-in-out infinite}
@keyframes bulb{0%,100%{opacity:.5}50%{opacity:1}}
.balloon{position:absolute;width:9%;aspect-ratio:.8;border-radius:50% 50% 48% 48%;z-index:3;animation:bobb 5s ease-in-out infinite;box-shadow:inset -6px -8px 14px rgba(0,0,0,.18),inset 6px 6px 10px rgba(255,255,255,.35)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:90%;background:rgba(255,255,255,.45)}
@keyframes bobb{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}

/* صفحهٔ ۱ */
.title{position:absolute;left:5%;right:5%;top:14%;text-align:center;z-index:5}
.title .t0{font-size:1.2em;font-weight:600;color:#ffd9ec;text-shadow:0 0 14px rgba(255,158,199,.9)}
.title h1{font-size:2.35em;font-weight:800;line-height:1.35;margin-top:.1em;text-shadow:0 0 24px rgba(255,158,199,.8)}
.chip{display:inline-block;margin-top:.5em;padding:.35em 1.1em;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);font-weight:600;font-size:1.02em;backdrop-filter:blur(3px)}
.title .t2{margin-top:.55em;font-size:1.25em;font-weight:800;color:#fff3c4;text-shadow:0 0 16px rgba(255,217,138,.9)}
.title p{margin-top:.6em;font-size:.95em;font-weight:300;opacity:.95;line-height:1.9}
.btn{font-family:inherit;border:0;color:#fff;background:linear-gradient(135deg,#ff7eb6,#9b7bff);padding:.8em 1.8em;border-radius:99px;font-size:1.15em;font-weight:600;box-shadow:0 6px 24px rgba(155,123,255,.5);cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.94)}
.btn.sm{font-size:.9em;padding:.5em 1.2em}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
#startBtn{position:absolute;left:50%;top:50.5%;transform:translateX(-50%);animation:pulse 2s infinite;z-index:6;white-space:nowrap;font-size:1.1em}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(155,123,255,.5)}50%{box-shadow:0 6px 38px rgba(255,126,182,.95)}}
.prog{position:absolute;left:6%;right:6%;top:57.2%;text-align:center;z-index:6;font-size:.82em}
.prog .gi{display:flex;justify-content:center;gap:.55em;margin-bottom:.35em}
.prog .gi i{font-style:normal;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4);font-size:1em;transition:.4s;opacity:.8}
.prog .gi i.on{background:rgba(255,217,138,.25);border:1px solid var(--gold);opacity:1;box-shadow:0 0 10px rgba(255,217,138,.6)}
.prog .path{opacity:.85;font-weight:300;margin-top:.3em;line-height:1.7}
.prog .rst{background:none;border:0;color:rgba(255,255,255,.55);font-family:inherit;font-size:.9em;text-decoration:underline;margin-top:.3em;cursor:pointer}

/* characters */
.char{position:absolute;z-index:4;pointer-events:none;transform-origin:50% 100%}
.char::after{content:'✨';position:absolute;right:2%;top:4%;font-size:1.05em;animation:tw 2.6s ease-in-out infinite}
.char img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.chph{aspect-ratio:3/4;border:2px dashed rgba(255,255,255,.45);border-radius:44% 44% 14% 14%;background:rgba(255,255,255,.07);display:grid;place-items:center;text-align:center;font-size:.7em;padding:.3em;line-height:1.4;color:rgba(255,255,255,.8)}
.a-float{animation:cfloat 4.2s ease-in-out infinite}
.a-sway{animation:csway 3.6s ease-in-out infinite}
.a-bounce{animation:cbounce 1.5s ease-in-out infinite}
.a-breathe{animation:cbreathe 3.2s ease-in-out infinite}
@keyframes cfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
@keyframes csway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes cbounce{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-8%) scaleY(1.03)}80%{transform:translateY(0) scaleY(.96)}}
@keyframes cbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* cat */
.cat{position:absolute;cursor:pointer;z-index:7}
.cat svg{width:100%;height:auto;overflow:visible;display:block}
.cat .tail{transform-origin:88px 128px;transform-box:view-box;animation:wag 2.2s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
.cat .head{transform-origin:60px 80px;transform-box:view-box;animation:nod 4s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.cat .bubble{position:absolute;bottom:100%;left:0;background:#fff;color:#222;padding:.4em .8em;border-radius:14px;font-size:.78em;white-space:nowrap;opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none}
.cat.say .bubble{opacity:1;transform:none}

/* gifts */
.gcell{position:absolute;width:46%;height:24%;z-index:5}
.gcell::before{content:"";position:absolute;left:4%;right:4%;bottom:12%;height:14%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,200,240,.38),transparent 70%)}
.gift{position:absolute;bottom:16%;width:40%;cursor:pointer;animation:bob 3.2s ease-in-out infinite;z-index:5}
.gcell:nth-child(2) .gift{animation-delay:-.8s}.gcell:nth-child(3) .gift{animation-delay:-1.6s}.gcell:nth-child(4) .gift{animation-delay:-2.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
.gift svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.gift .lid{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%;transform-box:fill-box}
.gift.g0.open .lid{transform:translateY(-30px)}
.gift.g1.open .lid{transform:translate(24px,-14px) rotate(32deg)}
.gift.g2.open .lid{transform:translateY(-34px) rotate(-200deg) scale(.9)}
.gift.g3.open .lid{animation:hop .6s ease-in-out;transform:translateY(-26px) rotate(-14deg)}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-22px)}55%{transform:translateY(-4px)}100%{transform:translateY(-26px) rotate(-14deg)}}
.gift.open svg{animation:gshake .45s}
@keyframes gshake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.gift .tap{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);opacity:0;animation:tapg 2.4s ease-in-out infinite}
@keyframes tapg{0%,100%{opacity:0}50%{opacity:.8}}
.gift.done .tap{display:none}
.glab{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:.8em;text-shadow:0 2px 6px #000;font-weight:600;line-height:1.3}
.gift.done::after{content:"✓";position:absolute;top:-6%;left:-6%;background:var(--gold);color:#222;border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;font-size:.8em}
.hint{position:absolute;left:0;right:0;text-align:center;font-size:.85em;opacity:.85;font-weight:300;z-index:6;pointer-events:none}
.head2{position:absolute;left:0;right:0;top:4.6%;text-align:center;font-size:1.5em;font-weight:800;text-shadow:0 0 18px rgba(183,156,255,.8);z-index:6}
.head2 small{display:block;font-size:.5em;font-weight:300;opacity:.9;margin-top:.3em}

/* page 3 */
.dim{position:absolute;inset:0;pointer-events:none;background:#04031a;opacity:.8;transition:opacity 1s;z-index:8}
.candle{position:absolute;width:13%;z-index:9;cursor:pointer}
.candle img{width:100%;display:block;image-rendering:pixelated}
.candle .cflame{position:absolute;left:0;top:0;opacity:0;transform-origin:50% 92%;transition:opacity .35s}
.candle.on .cflame{opacity:1;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-1.5deg)}to{transform:scale(.94,1.08) rotate(1.5deg)}}
.candle .glow{position:absolute;left:50%;top:6%;width:430%;aspect-ratio:1;transform:translate(-50%,-30%);border-radius:50%;background:radial-gradient(circle,rgba(255,190,100,.55),rgba(255,160,70,.18) 40%,transparent 68%);opacity:0;transition:opacity .6s;pointer-events:none}
.candle.on .glow{opacity:1;animation:glowp 2s ease-in-out infinite alternate}
@keyframes glowp{from{transform:translate(-50%,-30%) scale(1)}to{transform:translate(-50%,-30%) scale(1.08)}}
.candle .tapc{position:absolute;left:50%;top:30%;width:200%;aspect-ratio:1;transform:translate(-50%,-30%);border-radius:50%;border:1px dashed rgba(255,230,180,.55);animation:tapg 2s ease-in-out infinite}
.candle.on .tapc{display:none}
.ctext{position:absolute;left:9%;right:9%;top:28.8%;text-align:center;font-size:.92em;line-height:1.85;z-index:10;text-shadow:0 2px 10px #000,0 0 14px rgba(255,200,120,.5);font-weight:400;pointer-events:none}
.prop{position:absolute;cursor:pointer;z-index:5;transition:transform .2s}
.prop img{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.prop:active{transform:scale(.95)}
.prop.diary{animation:bob 4s ease-in-out infinite}
.plab{position:absolute;left:-8%;right:-8%;top:100%;margin-top:.15em;text-align:center;font-size:.62em;line-height:1.35;color:#ffe9cc;text-shadow:0 1px 6px #000,0 0 8px rgba(0,0,0,.8);pointer-events:none;font-weight:600}
.prop.seen::after{content:"✓";position:absolute;top:-6%;left:-4%;background:var(--gold);color:#222;border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center;font-size:.8em;z-index:2}
.toast{position:absolute;left:50%;bottom:11%;transform:translate(-50%,10px);background:rgba(20,14,50,.94);border:1px solid rgba(255,255,255,.25);padding:.6em 1.1em;border-radius:18px;font-size:.88em;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:92%;text-align:center;line-height:1.7}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* page 4: آهنگ‌ها */
.spot{transform-box:fill-box;transform-origin:50% 0;animation:spot 6s ease-in-out infinite alternate}
.spot.s2{animation-duration:8s;animation-direction:alternate-reverse}.spot.s3{animation-duration:7s}
@keyframes spot{from{transform:rotate(-7deg);opacity:.55}to{transform:rotate(7deg);opacity:1}}
.vinyl{position:absolute;width:52%;aspect-ratio:1;border-radius:50%;z-index:1;background:radial-gradient(circle,#ff7eb6 0 10%,#1a1030 11% 14%,transparent 15%),repeating-radial-gradient(circle,#141028 0 3px,#221845 3px 5px);box-shadow:0 0 30px rgba(255,126,182,.35);animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{position:absolute;left:0;right:0;bottom:0;height:8%;display:flex;align-items:flex-end;gap:2.2%;padding:0 4%;z-index:1;pointer-events:none;direction:ltr}
.eq i{flex:1;background:linear-gradient(#ff7eb6,#7b5cff);border-radius:4px 4px 0 0;animation:eqb 1.1s ease-in-out infinite alternate;opacity:.75}
@keyframes eqb{from{height:15%}to{height:100%}}
.songs{position:absolute;left:5%;right:5%;top:15.5%;bottom:19%;display:grid;grid-template-columns:1fr 1fr;gap:3%;overflow-y:auto;z-index:5;align-content:start;padding:2px}
.songs::-webkit-scrollbar{display:none}
.sc{background:rgba(18,10,45,.66);border:1px solid rgba(255,126,182,.45);border-radius:14px;padding:.45em;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.4);transition:.2s}
.sc.cur{border-color:#ffd98a;box-shadow:0 0 18px rgba(255,217,138,.5)}
.sc .cvr{position:relative;aspect-ratio:1/.82;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h),60%,42%),hsl(calc(var(--h) + 60),55%,22%))}
.sc .cvr .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:2em;color:rgba(255,255,255,.85)}
.sc .cvr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc .pb{position:absolute;right:.4em;bottom:.4em;width:2.2em;height:2.2em;border-radius:50%;background:rgba(255,126,182,.95);border:0;color:#fff;font-size:1em;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sc .st{font-weight:800;font-size:.78em;margin-top:.4em;line-height:1.35;text-align:start}
.sc .sa{font-size:.64em;opacity:.8;text-align:start;margin-top:.1em}
.sc .se{margin-top:.3em;font-size:.62em;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:.25em .45em;background:rgba(255,255,255,.08);line-height:1.5}

/* page 5 */
.aurora{position:absolute;left:-20%;right:-20%;height:40%;border-radius:50%;z-index:1;pointer-events:none;animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-6%) scaleY(.9)}to{transform:translateX(6%) scaleY(1.15)}}
.shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff);z-index:2;opacity:0;transform:rotate(25deg);animation:shoot 7s linear infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(25deg);opacity:0}2%{opacity:1}12%{transform:translate(160px,75px) rotate(25deg);opacity:0}100%{opacity:0}}
.rays{position:absolute;left:50%;top:48%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:2;pointer-events:none;border-radius:50%;opacity:.28;background:repeating-conic-gradient(from 0deg,rgba(255,200,240,.9) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 40s linear infinite}
.ftop{position:absolute;left:8%;right:8%;top:17%;text-align:center;font-size:1.32em;font-weight:600;line-height:1.8;z-index:7;text-shadow:0 0 18px rgba(255,158,199,.9)}
.bigbox{position:absolute;left:50%;top:33%;width:50%;transform:translateX(-50%);cursor:pointer;animation:bob2 3.5s ease-in-out infinite;z-index:6}
@keyframes bob2{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4%)}}
.bigbox svg{width:100%;overflow:visible;display:block;filter:drop-shadow(0 0 30px rgba(255,158,199,.55))}
.bigbox .lid{transition:transform .8s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 100%;transform-box:fill-box}
.bigbox.open .lid{transform:translateY(-34px) rotate(-18deg)}
.finalmsg{position:absolute;left:8%;right:8%;top:66%;text-align:center;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:7}
.finalmsg.on{opacity:1;pointer-events:auto}
.vrow{display:flex;gap:.6em;justify-content:center;align-items:center;flex-wrap:wrap}
.hc{transition:opacity 1.6s}
#s5.calm .hc,#s5.calm .finalmsg{opacity:0!important;pointer-events:none}
.fsky{position:absolute;inset:0;z-index:7;pointer-events:none}
.fsky svg{position:absolute;left:0;top:0;width:100%;height:100%}
.fsky line{stroke:rgba(255,230,170,.5);stroke-width:1;stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1.8s}
.fsky line.on{stroke-dashoffset:0}
.fstar{position:absolute;font-size:2em;transform:translate(-50%,-50%) scale(0);opacity:0;color:#ffe9a8;text-shadow:0 0 16px #ffd98a,0 0 30px rgba(255,217,138,.6);transition:transform 1.4s cubic-bezier(.3,1.6,.5,1),opacity 1.4s;cursor:pointer;pointer-events:auto;padding:.2em}
.fstar.on{transform:translate(-50%,-50%) scale(1);opacity:1;animation:stw 3.2s ease-in-out infinite 1.4s}
.fstar.cur{color:#fff;text-shadow:0 0 22px #fff,0 0 40px #ffd98a}
@keyframes stw{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.18)}}
.wpanel{position:absolute;left:8%;right:8%;top:53%;min-height:22%;text-align:center;font-size:1.02em;line-height:2;font-weight:300;color:#fff3d0;text-shadow:0 0 14px rgba(255,217,138,.8);opacity:0;transition:opacity 1.1s;pointer-events:none;z-index:7}
.wpanel.on{opacity:1}
.wpanel.end{font-size:1.4em;font-weight:800;line-height:1.9;color:#fff}
.wpanel small{display:block;margin-bottom:.5em;opacity:.75;font-size:.8em}
.factions{position:absolute;left:4%;right:4%;top:80.5%;z-index:8;display:none;flex-wrap:wrap;gap:.5em;justify-content:center}
.factions.on{display:flex}

/* nav & topbar */
.nav{position:absolute;left:0;right:0;bottom:1.2%;display:flex;justify-content:center;align-items:center;gap:1em;z-index:30;pointer-events:none;opacity:0;transition:opacity .4s;direction:ltr}
.nav.on{opacity:1}
.nav button{pointer-events:auto;font-family:inherit;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);width:2.7em;height:2.7em;border-radius:50%;font-size:1.1em;cursor:pointer;backdrop-filter:blur(4px)}
.nav button:disabled{opacity:.25}
.nmid{text-align:center;direction:rtl;min-width:7.5em;text-shadow:0 1px 4px #000;pointer-events:none}
.nmid b{display:block;font-size:.72em;font-weight:600}
.dots{display:flex;flex-direction:row-reverse;gap:.5em;justify-content:center;margin-top:.25em;pointer-events:auto}.dots i{width:.6em;height:.6em;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}.dots i.a{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.topbar{position:absolute;left:0;right:0;top:.8%;z-index:36;display:flex;gap:.5em;align-items:center;padding:0 3%;pointer-events:none}
.topbar>*{pointer-events:auto}
.sfx{width:2.3em;height:2.3em;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(20,12,50,.6);backdrop-filter:blur(4px);color:#fff;font-size:1em;cursor:pointer;flex:none}
.mp{direction:ltr;flex:1;display:none;align-items:center;gap:.4em;background:rgba(20,12,50,.78);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:.2em .6em;backdrop-filter:blur(6px);min-width:0}
.mp.on{display:flex}
.mp button{background:none;border:0;color:#fff;font-size:1em;cursor:pointer;flex:none;padding:.1em .3em}
.mp .mpi{flex:1;min-width:0;line-height:1.25;overflow:hidden}
.mp .mpi b{display:block;font-size:.72em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
.mp .mpi small{font-size:.6em;opacity:.8;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}

.card.dedi{text-align:center;padding:2em 1.2em 1.6em;background:linear-gradient(160deg,#5a2a7a,#2a1a5e 60%,#1a1240);border-color:rgba(255,158,199,.5);box-shadow:0 0 50px rgba(255,126,182,.4)}
.card.dedi .big{font-size:1.9em;letter-spacing:.15em;margin-bottom:.4em}
.card.dedi .tx{font-size:1.3em;font-weight:600;line-height:1.9;margin-bottom:.8em;text-shadow:0 0 16px rgba(255,158,199,.7)}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-top:1em;font-size:.85em;gap:.5em}
.mnav button{font-family:inherit;background:rgba(255,255,255,.15);border:0;color:#fff;padding:.5em 1em;border-radius:99px;cursor:pointer}
.mnav button:disabled{opacity:.25}
.dlrow{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.9em;justify-content:center}
.dlrow button,.dl{font-family:inherit;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:.45em 1em;border-radius:99px;font-size:.82em;cursor:pointer}
.opt{display:block;width:100%;margin:.5em 0;padding:.7em;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:1em;cursor:pointer;transition:.15s}
.opt.sel{background:rgba(155,123,255,.4);border-color:#c9b6ff}
.opt.bad{animation:shake .4s;border-color:#ff7a9a}.opt.good{background:rgba(120,255,180,.25);border-color:#8fffc0}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{font-size:.85em;opacity:.9;margin-top:.8em;font-weight:300;min-height:1.6em;line-height:1.8}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.sky{position:relative;height:23dvh;border-radius:16px;background:radial-gradient(circle at 50% 100%,#3a2a7a,#0a0a2a);overflow:hidden;margin-bottom:.7em;border:1px solid rgba(255,255,255,.2)}

.sstar{position:absolute;font-size:1.7em;transform:translate(-50%,-50%) scale(0);opacity:0;color:#ffe9a8;text-shadow:0 0 14px #ffd98a;transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .9s;cursor:pointer;padding:.1em}

.empty{border:2px dashed rgba(255,255,255,.35);border-radius:14px;padding:1.4em;text-align:center;font-size:.9em;line-height:2;opacity:.9}

/* نامه */
.ov{position:absolute;inset:0;z-index:45;background:rgba(5,4,20,.84);display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex;animation:fade .3s}
.lt-stack{position:relative;width:90%;aspect-ratio:736/1040;max-height:80dvh;container-type:inline-size}
.lt-paper{position:absolute;inset:0;transform:translateY(6%) scale(.34) rotate(-4deg);opacity:0;transition:transform 1.5s cubic-bezier(.2,1.15,.3,1) .25s,opacity .5s .2s;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
.lt-paper img{width:100%;height:100%;display:block;border-radius:3px}
.lt-text{position:absolute;left:9%;right:9%;top:17.3%;height:82.95cqw;overflow:hidden;direction:rtl;text-align:right;font-size:3.7cqw;line-height:5.53cqw;white-space:pre-line;font-weight:400;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s}
.lt-text b{font-weight:800}
.lt-text.on{opacity:1;transform:none}
.lt-envw{position:absolute;left:50%;top:50%;width:84%;transform:translate(-50%,-50%);cursor:pointer;z-index:3;transition:transform 1.1s cubic-bezier(.5,0,.8,.4),opacity .9s .2s}
.lt-envw img{width:100%;display:block;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.lt-envw.shake{animation:wob .55s ease-in-out}
@keyframes wob{0%,100%{transform:translate(-50%,-50%) rotate(0)}20%{transform:translate(-50%,-50%) rotate(-3deg)}40%{transform:translate(-50%,-50%) rotate(3deg)}60%{transform:translate(-50%,-50%) rotate(-2deg)}80%{transform:translate(-50%,-50%) rotate(2deg)}}
.lt-stack.go .lt-envw{transform:translate(-50%,110%) rotate(-7deg);opacity:0;pointer-events:none}
.lt-stack.go .lt-paper{transform:none;opacity:1}
.lt-seal{position:absolute;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.lt-envw.shake .lt-seal{animation:ring .8s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,230,160,.9);background:radial-gradient(circle,rgba(255,240,190,.9),transparent 70%)}100%{box-shadow:0 0 0 60px rgba(255,230,160,0);background:transparent}}
.lt-hint{margin-top:.8em;font-size:.9em;opacity:.9;animation:tapg 2s infinite}
.lt-nav{margin-top:.6em;display:none;width:90%}
.lt-nav.on{display:flex}
.burst{position:absolute;z-index:90;pointer-events:none;animation:burst 1.3s ease-out forwards;font-size:1.3em}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1.3);opacity:0}}

/* دفتر */
.dv{perspective:1400px}
.dv-closed{width:68%;transition:transform .45s ease-in,opacity .45s;transform:scale(.7);opacity:0;filter:drop-shadow(0 14px 24px rgba(0,0,0,.6))}
.dv.on .dv-closed{transform:scale(1);opacity:1;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.dv.flip .dv-closed{transform:rotateY(90deg) scale(1.05);opacity:.4;transition:transform .45s ease-in,opacity .45s}
.dv-vp{display:none;position:relative;width:97%;aspect-ratio:229.5/335;max-height:78dvh;overflow:hidden;direction:ltr;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.6);background:#f3ece8}
.dv.open .dv-closed{display:none}
.dv.open .dv-vp{display:block;animation:unfold .65s cubic-bezier(.2,1,.3,1)}
@keyframes unfold{from{transform:rotateY(-80deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.dv-spread,.lf{container-type:inline-size}
.dv-spread{position:absolute;left:0;top:0;width:200%;height:100%;transition:transform .7s cubic-bezier(.5,0,.2,1)}
.dv-spread.nt{transition:none}
.dv-spread>img,.lf>img{width:100%;height:100%;display:block;position:absolute;inset:0}
.dv-t{position:absolute;direction:rtl;text-align:right;color:#6b4a5c;font-size:1.95cqw;line-height:1.95;overflow-y:auto;font-weight:400}
.dv-t::-webkit-scrollbar{width:4px}.dv-t::-webkit-scrollbar-thumb{background:rgba(181,84,126,.55);border-radius:4px}.dv-t{scrollbar-width:thin;scrollbar-color:rgba(181,84,126,.55) transparent;padding-left:.5cqw}
.dv-t.l{left:5.2%;width:39.5%;top:19.5%;height:66%}
.dv-t.r{left:54.5%;width:37%;top:19.6%;height:62%}

.dv-t p{margin-bottom:.55em}
.dv-t .stks{display:flex;gap:.7em;justify-content:center;margin:.5em 0 .7em}
.dv-t .stks img{width:22%;aspect-ratio:1;object-fit:cover;border:.5cqw solid #fff;border-radius:1.2cqw;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.3);transform:rotate(var(--r))}
.dv-t label{display:block;font-weight:600;margin-top:.6em;font-size:.95em;line-height:1.7}
.dv-t textarea{width:100%;min-height:4em;border:0;border-bottom:1px dashed #b48aa0;background:rgba(255,255,255,.55);border-radius:6px;padding:.4em .5em;font-size:1em;color:#4a2f3f;resize:none;direction:rtl;line-height:1.8}
.dv-t .frow{display:flex;gap:.5em;margin:.8em 0 .4em;flex-wrap:wrap;position:sticky;bottom:0;background:linear-gradient(transparent,rgba(250,244,244,.97) 30%);padding:.5em 0 .2em;z-index:2}
.dv-t .frow button{font-family:inherit;border:0;border-radius:99px;padding:.45em 1.1em;background:#b5547e;color:#fff;font-size:.95em;cursor:pointer}
.dv-t .frow button.g{background:#8e7aa8}
.dv-t .fnote{font-size:.85em;opacity:.85;line-height:1.8;margin-top:.3em}
.dv-pn{position:absolute;bottom:6.2%;font-size:1.7cqw;color:#a88aa0;font-weight:600}
.dv-pn.l{left:22%}.dv-pn.r{left:73%}
.lf{position:absolute;top:0;height:100%;width:50%;overflow:hidden;display:none;z-index:6;pointer-events:none;box-shadow:0 0 22px rgba(0,0,0,.4)}
.lf>.in{position:absolute;top:0;height:100%;width:200%}
.lf.f{left:50%;transform-origin:left center;animation:leafF .7s ease-in forwards}
.lf.f>.in{left:-100%}
.lf.b{left:0;transform-origin:right center;animation:leafB .7s ease-in forwards}
.lf.b>.in{left:0}
@keyframes leafF{0%{transform:perspective(1200px) rotateY(0);filter:brightness(1)}100%{transform:perspective(1200px) rotateY(-92deg);filter:brightness(.7)}}
@keyframes leafB{0%{transform:perspective(1200px) rotateY(0);filter:brightness(1)}100%{transform:perspective(1200px) rotateY(92deg);filter:brightness(.7)}}
.dv-nav{margin-top:.6em;width:96%;display:none}
.dv.open .dv-nav{display:flex}
.dv-top{display:none;margin-top:.5em}
.dv.open .dv-top{display:flex;gap:.5em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>

function tone(f,t0,d,v,ty){const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t0; o.type=ty||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,n); g.gain.linearRampToValueAtTime(v,n+.03); g.gain.exponentialRampToValueAtTime(.0001,n+d); o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+.05);}

  for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(); f.type='bandpass'; f.frequency.value=fq; g.gain.value=v; s.buffer=b; s.connect(f); f.connect(g); g.connect(c.destination); s.start();}

function tokens(L){ const out=[]; L.title.split(/\s+/).forEach(w=>out.push({w,b:1})); out.push('\n','\n');

    if(cur.length&&el.scrollHeight>el.clientHeight+2){ pages.push(tokHTML(cur).replace(/\n+$/,'')); cur=(t==='\n')?[]:[t]; } else cur=test; }

const spreadOf=i=>Math.floor(i/2), sideOf=i=>i%2;
function fitText(el){ el.style.fontSize=''; el.style.lineHeight=''; let fs=1.95; while(el.scrollHeight>el.clientHeight+1&&fs>1.45){ fs-=.05; el.style.fontSize=fs+'cqw'; el.style.lineHeight=(1.68+(fs-1.45)/.5*.27).toFixed(2); } }
function fillSpread(s){ const L=$('#dvL'),R=$('#dvR'); [[L,2*s],[R,2*s+1]].forEach(([el,pi])=>{ el.innerHTML=DPAGES[pi]?DPAGES[pi]():''; el.scrollTop=0; el.style.fontSize=''; el.style.lineHeight=''; if(pi!==3&&DPAGES[pi]) fitText(el); });
  $('#pnL').textContent=DPAGES[2*s]?fa(2*s+1):''; $('#pnR').textContent=DPAGES[2*s+1]?fa(2*s+2):'';
  $$('.dv-t textarea').forEach(t=>{ t.value=S.ans[+t.dataset.i]||''; t.oninput=()=>{ S.ans[+t.dataset.i]=t.value; S.ansSaved=0; save(); const n=$('#ansNote'); if(n) n.textContent='در حال نوشتن… (خودکار هم ذخیره می‌شه)'; }; });
  $$('.dv-t img').forEach(i=>i.addEventListener('load',()=>{ const t=i.closest('.dv-t'); if(t) fitText(t); }));
  $$('.dv-t .stk').forEach(im=>{ im.style.cursor='pointer'; im.onclick=()=>{ dlUrl(im.getAttribute('src'),'sticker-'+(+im.dataset.i+1)+'.jpg'); sfx('pop'); toast('برچسب دانلود شد'); }; });
  $$('.dv-t textarea').forEach(t=>t.addEventListener('focus',()=>setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}},350)));
  const sv=$('#ansSave'); if(sv) sv.onclick=()=>{ S.ansSaved=1; save(); $('#ansNote').textContent='ذخیره شد ✓ (روی همین گوشی می‌مونه)'; sfx('ok'); };
  const dl=$('#ansDl'); if(dl) dl.onclick=()=>dlText('جواب-های-غزل','جواب‌های غزل\n\n'+D.p4.qs.map((q,i)=>`${i+1}- ${q}\n${S.ans[i]||'(بدون جواب)'}`).join('\n\n')); }
function dvPos(i,animate){ dvsp.classList.toggle('nt',!animate); dvsp.style.transform=sideOf(i)?'translateX(-50%)':'translateX(0)'; if(!animate){void dvsp.offsetWidth; dvsp.classList.remove('nt');} }
function dvNav(){ const n=DPAGES.length; $('#dvnav').innerHTML=`<button id="dq" ${dvi==0?'disabled':''}>صفحهٔ قبل</button><span>صفحه ${fa(dvi+1)} از ${fa(n)}</span><button id="dp" ${dvi>=n-1?'disabled':''}>صفحهٔ بعد</button>`;
  $('#dp').onclick=()=>dvGo(dvi+1); $('#dq').onclick=()=>dvGo(dvi-1); }
function dvGo(ni){ if(dvBusy||ni<0||ni>=DPAGES.length) return; const os=spreadOf(dvi), ns=spreadOf(ni);
  if(os===ns){ dvi=ni; dvPos(dvi,true); sfx('page'); dvNav(); S.diary=Math.max(S.diary||0,dvi+1); save(); return; }
  dvBusy=true; sfx('page'); const fwd=ni>dvi; dvlfin.innerHTML=dvsp.innerHTML; dvlf.className='lf '+(fwd?'f':'b'); dvlf.style.display='block';
  fillSpread(ns); /* زیر ورق عوض می‌شه */
  setTimeout(()=>{ dvlf.style.display='none'; dvlf.className='lf'; dvi=ni; dvPos(dvi,true); dvNav(); dvBusy=false; S.diary=Math.max(S.diary||0,dvi+1); save(); },720); }
$('#diaryProp').onclick=()=>{ if(needLight()) return; $('#toast2').classList.remove('on');
  dv.classList.remove('open','flip'); dvi=0; dvBusy=false; $('#dvnav').innerHTML=''; dv.classList.add('on'); sfx('open'); void dv.offsetWidth;
  setTimeout(()=>dv.classList.add('flip'),900);
  setTimeout(()=>{ dv.classList.add('open'); fillSpread(0); dvPos(0,false); dvNav(); S.diary=Math.max(S.diary||0,1); save(); $('#diaryProp').classList.add('seen'); },1350);
  $('#dvtop').innerHTML='<button class="dl" id="dvAll">💾 دانلود متن دفتر</button>';
  $('#dvAll').onclick=()=>dlText('دفتر-خاطرات',[D.p1.title+'\n'+D.p1.text,D.p2.title+'\n'+D.p2.a+'\n'+D.p2.b,D.p3.title+'\n'+D.p3.text,D.p4.title+'\n'+D.p4.qs.map((q,i)=>`${i+1}- ${q}\n${S.ans[i]||''}`).join('\n')].join('\n\n──────\n\n')); };
$('#dvx').onclick=()=>{dv.classList.remove('on','open','flip');};
if(S.diary) $('#diaryProp').classList.add('seen');

/* ---------- صفحهٔ ۴: پلی‌لیست + پلیر دائمی ---------- */
$('#coverHead').innerHTML=`${esc(CONFIG.coverHead)}<small>${esc(CONFIG.coverSub)}</small>`;
const AU=new Audio(); AU.preload='auto'; let cur=-1;
const covers=[];   /* {url, ext} */
CONFIG.songs.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='sc'; d.style.setProperty('--h',[320,270,220,340][i%4]);
  d.innerHTML=`<div class="cvr"><div class="ph">♪</div><button class="pb" data-i="${i}" aria-label="پخش">▶</button></div><div class="st" dir="auto">${esc(s.title)}</div><div class="sa" dir="auto">${esc(s.artist)}</div><div class="se">${esc(s.tag)}</div>`;
  $('#songs').appendChild(d);
  firstImg(s.cover,(url,ext)=>{ covers[i]={url,ext}; const im=new Image(); im.src=url; im.alt=''; $('.cvr',d).insertBefore(im,$('.pb',d)); });
  $('.pb',d).onclick=e=>{ e.stopPropagation(); togglePlay(i); };
  d.onclick=()=>openSong(i); });
function openSong(i){ const s=CONFIG.songs[i];
  openModal(`<h3 dir="auto" style="padding-left:1.4em">${esc(s.title)}</h3><div style="opacity:.8;margin:-.4em 0 .6em;font-size:.9em" dir="auto">${esc(s.artist)}</div>
    <div id="sCover"></div><div class="chip" style="margin:.2em 0 .7em;font-size:.85em">${esc(s.tag)}</div><div class="tx">${esc(s.note)}</div>
    <div class="dlrow"><button class="btn sm" id="sPlay">${(cur===i&&!AU.paused)?'❚❚ توقف':'▶ پخش'}</button><button id="sDlA">⬇ دانلود آهنگ</button><button id="sDlC">🖼 دانلود کاور</button></div>`);
  if(covers[i]) $('#sCover').innerHTML=`<img class="cimg" style="border-radius:14px;max-width:70%" src="${covers[i].url}" alt="">`;
  $('#sPlay').onclick=()=>{ togglePlay(i); setTimeout(()=>{const b=$('#sPlay'); if(b) b.textContent=(cur===i&&!AU.paused)?'❚❚ توقف':'▶ پخش';},200); };
  $('#sDlA').onclick=()=>dlSong(i); $('#sDlC').onclick=()=>{ if(covers[i]) dlUrl(covers[i].url,s.title+' - cover'+covers[i].ext); else toast('کاور این آهنگ هنوز اضافه نشده'); }; }
function dlSong(i){ const s=CONFIG.songs[i]; if(cur!==i){ selectTrack(i,false); }
  setTimeout(()=>{ if(AU._missing) toast('فایل این آهنگ هنوز اضافه نشده'); else dlUrl(AU.src,s.title+' - '+s.artist+(AU._ext||'.mp3')); },250); }
function selectTrack(i,play){ const s=CONFIG.songs[i];
  if(cur!==i){ cur=i; S.track=i; save(); AU.pause(); setAudio(AU,s.file,()=>{ toast('فایل این آهنگ هنوز اضافه نشده ('+s.file.replace(/^assets\//,'')+')'); updPlayer(); }); AU.currentTime=0; }
  if(play){ stopVoice(); const p=AU.play(); if(p&&p.catch) p.catch(()=>{}); }
  $('#mp').classList.add('on'); updPlayer(); }
function togglePlay(i){ if(cur===i&&!AU.paused){ AU.pause(); } else selectTrack(i,true); updPlayer(); }
function updPlayer(){ const s=CONFIG.songs[cur]; if(!s) return; $('#mpT').textContent=s.title; $('#mpA').textContent=s.artist; const pl=!AU.paused&&!AU._missing;
  $('#mpPlay').textContent=pl?'❚❚':'▶'; $$('.sc').forEach((c,k)=>{ c.classList.toggle('cur',k===cur); $('.pb',c).textContent=(k===cur&&pl)?'❚❚':'▶'; }); }
['play','pause','ended','loadedmetadata'].forEach(ev=>AU.addEventListener(ev,updPlayer));
AU.addEventListener('timeupdate',()=>{ if(AU.duration) $('#mpSeek').value=AU.currentTime/AU.duration*100; });
$('#mpSeek').oninput=e=>{ if(AU.duration) AU.currentTime=e.target.value/100*AU.duration; };
$('#mpPlay').onclick=()=>{ if(cur<0) return; togglePlay(cur); };
$('#mpNext').onclick=()=>{ const n=(cur+1)%CONFIG.songs.length; selectTrack(n,true); };
$('#mpPrev').onclick=()=>{ const n=(cur-1+CONFIG.songs.length)%CONFIG.songs.length; selectTrack(n,true); };
$('#mpDl').onclick=()=>{ if(cur>=0) dlSong(cur); };
if(S.track>=0&&CONFIG.songs[S.track]){ cur=S.track; setAudio(AU,CONFIG.songs[cur].file,()=>{}); $('#mp').classList.add('on'); updPlayer(); }  /* بدون پخش خودکار */
const sfxBtn=$('#sfxBtn'); const updSfx=()=>{ sfxBtn.textContent=S.sfx?'🔔':'🔕'; sfxBtn.title=S.sfx?'افکت‌های صوتی روشن':'افکت‌های صوتی خاموش'; };
sfxBtn.onclick=()=>{ S.sfx=S.sfx?0:1; save(); updSfx(); toast(S.sfx?'افکت‌های صوتی ظریف روشن شد':'افکت‌های صوتی خاموش شد'); if(S.sfx) sfx('pop'); }; updSfx();

/* ---------- صفحهٔ ۵: هدیهٔ آخر ---------- */
const F=CONFIG.final; $('#ftop').textContent=F.top; $('#finalHint').textContent=F.open;
$('#bigbox').innerHTML=giftSVG('#7a45c9','#ffd98a');
$('#voiceBtn').textContent='▶ '+F.open;
const VA=new Audio(); VA.preload='auto'; let voiceInit=false, boxOpen=false, fTimers=[], starsOn=false;
const WISH=CONFIG.stars.wishes, SPOS=[[22,36],[40,24],[58,38],[76,26],[80,46]];
(function(){ const sky=$('#fsky'), svg=$('#fsvg'); SPOS.forEach((p,i)=>{ const s=document.createElement('div'); s.className='fstar'; s.dataset.i=i; s.style.left=p[0]+'%'; s.style.top=p[1]+'%'; s.textContent='✦'; sky.appendChild(s);
  if(i>0) svg.insertAdjacentHTML('beforeend',`<line x1="${SPOS[i-1][0]}" y1="${SPOS[i-1][1]}" x2="${p[0]}" y2="${p[1]}"/>`); }); })();
function stopVoice(){ if(voiceInit&&!VA.paused){ VA.pause(); $('#voiceBtn').textContent='▶ '+F.open; } }
function initVoice(){ if(voiceInit) return; voiceInit=true;
  setAudio(VA,CONFIG.files.voice,()=>{ $('#voiceNote').textContent='فایل صدا هنوز اضافه نشده (assets/voice.mp3) — برای تست، آرزوها شروع می‌شن'; setTimeout(()=>runStars(0),1500); });
  VA.addEventListener('ended',()=>{ $('#voiceBtn').textContent='▶ دوباره پخش'; runStars(0); });
  VA.addEventListener('play',()=>{ $('#voiceBtn').textContent='❚❚ توقف'; }); VA.addEventListener('pause',()=>{ if(!VA.ended) $('#voiceBtn').textContent='▶ ادامه'; }); }
$('#bigbox').onclick=()=>{ if(boxOpen) return; boxOpen=true; $('#bigbox').classList.add('open'); $('#finalHint').style.display='none'; sfx('open');
  const r=$('#bigbox').getBoundingClientRect(); burst(r.left+r.width/2,r.top+10,['✨','💖','⭐'],10); setTimeout(()=>$('#finalmsg').classList.add('on'),700); };
$('#voiceBtn').onclick=()=>{ initVoice(); AU.pause(); updPlayer();
  if(VA.paused){ const p=VA.play(); if(p&&p.catch) p.catch(()=>{}); $('#skipBtn').style.display=''; } else VA.pause(); };
$('#skipBtn').onclick=()=>{ VA.pause(); runStars(0); };
const clearF=()=>{ fTimers.forEach(clearTimeout); fTimers=[]; };
function lightStars(n,cur){ $$('#fsky .fstar').forEach((s,i)=>{ s.classList.toggle('on',i<=n); s.classList.toggle('cur',i===cur); }); $$('#fsvg line').forEach((l,i)=>l.classList.toggle('on',i<n)); }
function setPanel(html,end){ const p=$('#wpanel'); p.classList.remove('on'); setTimeout(()=>{ p.className='wpanel on'+(end?' end':''); p.innerHTML=html; },end?400:700); }
function showWish(i){ lightStars(i,i); sfx('star'); setPanel(`<small>آرزوی ${fa(i+1)} از ${fa(WISH.length)} ✦</small>${esc(WISH[i])}`); }
function showEnd(){ lightStars(WISH.length-1,-1); setPanel(esc(F.last),true); sfx('ok'); S.fin=1; save(); setTimeout(showActions,1200); }
function showActions(){ const a=$('#factions'); a.classList.add('on'); a.innerHTML=`<button class="btn sm ghost" id="aVoice">🎧 دوباره بشنو</button><button class="btn sm ghost" id="aWish">✨ مرور آرزوها</button><button class="btn sm ghost" id="aHome">🏠 صفحهٔ اول</button><button class="btn sm ghost" id="aDlW">💾 آرزوها</button><button class="btn sm ghost" id="aDlV">⬇ صدا</button>`;
  $('#aVoice').onclick=()=>{ clearF(); $('#s5').classList.remove('calm'); starsOn=false; $('#factions').classList.remove('on'); $('#wpanel').classList.remove('on'); lightStars(-1,-1); initVoice(); VA.currentTime=0; const p=VA.play(); if(p&&p.catch)p.catch(()=>{}); $('#skipBtn').style.display=''; };
  $('#aWish').onclick=()=>runStars(0); $('#aHome').onclick=()=>go(0); $('#aDlW').onclick=()=>dlText('آرزوها',WISH.map((t,k)=>`${k+1}) ${t}`).join('\n\n')+'\n\n'+F.last);
  $('#aDlV').onclick=()=>{ if(voiceInit&&!VA._missing) dlUrl(VA.src,'voice-message'+(VA._ext||'.mp3')); else toast('فایل صدا هنوز اضافه نشده'); }; }
function runStars(from){ clearF(); starsOn=true; $('#s5').classList.add('calm'); $('#factions').classList.remove('on'); lightStars(-1,-1); let t=1300;
  for(let i=from;i<WISH.length;i++){ const k=i; fTimers.push(setTimeout(()=>showWish(k),t)); t+=3800+WISH[i].length*55; }
  fTimers.push(setTimeout(showEnd,t)); }
$$('#fsky .fstar').forEach(s=>s.onclick=()=>{ if(!starsOn) return; clearF(); showWish(+s.dataset.i); setTimeout(showActions,600); });

/* ---------- ناوبری (برگشت تا صفحهٔ اول همیشه ممکنه) ---------- */
const ids=['s1','s2','s3','s4','s5']; let curScene=0;
const dots=$('#dots'); ids.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);dots.appendChild(d);});
function go(n){
  if(n<0||n>=ids.length) return; closeModal(); lt.classList.remove('on'); dv.classList.remove('on','open','flip'); curScene=n; clearF();
  ids.forEach((id,i)=>document.getElementById(id).classList.toggle('active',i===n));
  $$('i',dots).forEach((d,i)=>d.classList.toggle('a',i===n));
  $('#nav').classList.toggle('on',n>0); $('#prev').disabled=n<=0; $('#next').disabled=n>=ids.length-1; $('#pgLabel').textContent=`صفحه ${fa(n+1)} از ${fa(ids.length)}`;
  if(n!==4&&voiceInit&&!VA.paused){ VA.pause(); }
  if(n===4&&starsOn){ lightStars(WISH.length-1,-1); $('#wpanel').className='wpanel on end'; $('#wpanel').textContent=F.last; showActions(); }
  if(n>0){ S.scene=n; save(); } updProg(); }
$('#next').onclick=()=>go(curScene+1); $('#prev').onclick=()=>go(curScene-1);
updProg(); go(0);
</script>
</body>
</html>
